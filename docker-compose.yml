# Local development database. The app itself runs with `npm run dev`.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: labops
      POSTGRES_PASSWORD: labops_dev
      POSTGRES_DB: labops
    ports:
      - "5432:5432"
    volumes:
      - labops-db:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  labops-db:
